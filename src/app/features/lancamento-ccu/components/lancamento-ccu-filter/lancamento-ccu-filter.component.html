<div>
  <app-page-breadcrumb pageTitle="Lançamento CCU" />
  <div class="grid grid-cols-1">
    <app-component-card title="Filtro de Pesquisa">
      <div class="grid grid-cols-6 gap-3">
        <div class="col-span-5">
          <app-label for="txtCodigo">Código</app-label>
          <app-input-field
            type="text"
            id="txtCodigo"
            [value]="filtros().codigo ?? ''"
            (valueChange)="atualizarFiltro('codigo', $event.toString())"
          />
        </div>
        <div>
          <app-label for="ddlStatus">Status</app-label>
          <app-select
            id="ddlStatus"
            [options]="statusArray"
            placeholder="Selecione um status"
            (valueChange)="atualizarFiltro('statusId', +$event)"
          ></app-select>
        </div>
      </div>
    </app-component-card>
  </div>
