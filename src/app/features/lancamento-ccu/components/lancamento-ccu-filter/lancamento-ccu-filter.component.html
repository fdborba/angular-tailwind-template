<app-component-card title="Filtro de Pesquisa">
  <div class="grid grid-cols-4 gap-3">
    <div class="col-span-3">
      <app-label for="txtCodigo">Código</app-label>
      <app-input-field
        type="text"
        id="txtCodigo"
        [value]="filtros().codigo ?? ''"
        (valueChange)="atualizarFiltro('codigo', $event.toString())"
      />
    </div>
    <div class="col-span-1">
      <app-label for="ddlStatus">Status</app-label>
      <app-select
        id="ddlStatus"
        [options]="statusArray"
        placeholder="Selecione um status"
        [value]="filtros().status?.toString() ?? ''"
        (valueChange)="atualizarFiltro('status', $event ? +$event : null)"
      ></app-select>
    </div>
  </div>
</app-component-card>
<app-barra-botoes>
  <app-button
    size="sm"
    variant="outline"
    (btnClick)="onLimpar()"
    [disabled]="loading()"
  >
    <i class="fas fa-eraser"></i> Limpar
  </app-button>
  <app-button size="sm" (btnClick)="onPesquisar()" [disabled]="loading()">
    @if (loading()) { <span class="animate-spin">⟳</span> }
    <i class="fas fa-search"></i> Pesquisar
  </app-button>
</app-barra-botoes>
