<div>
  <app-page-breadcrumb pageTitle="Lançamento CCU" />

  <app-lancamento-ccu-filter
    [loading]="store.loading()"
    (pesquisar)="onPesquisar($event)"
    (limpar)="store.limpar()"
  />

  <app-lancamento-ccu-table [rows]="store.rows()" [loading]="store.loading()" />

  @if (store.erro()) {
  <div
    class="text-sm text-red-600 bg-red-50 border border-red-200 rounded px-4 py-3"
  >
    {{ store.erro() }}
  </div>
  }
</div>
